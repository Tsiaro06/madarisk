openapi: 3.0.3
info:
  title: MadaRisk Map - API Backend
  description: |
    Plateforme SIG de surveillance et d'anticipation des catastrophes naturelles à Madagascar.

    La plupart des endpoints nécessitent un jeton d'accès JWT.
    Obtenez-le via `POST /auth/login`, puis cliquez sur **Authorize** et renseignez `Bearer <votre_token>`.

    Conventions :
    - Réponse de succès : `{ success: true, message, data, meta? }`.
    - Réponse d'erreur : `{ success: false, message, errors? }`.
    - Pagination : `page` (défaut 1), `limit` (défaut 20, max 100), `meta: { page, limit, total, totalPages }`.
    - Erreurs : `400` requête invalide, `401` non authentifié, `403` rôle insuffisant,
      `404` introuvable, `409` conflit, `422` échec de validation (zod), `429` trop de requêtes,
      `500` erreur interne.
    - Rôles : `SUPER_ADMIN`, `ADMIN`, `ANALYSTE_SIG`, `CLIENT`.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Serveur local de développement - API versionnée
  - url: http://localhost:5000
    description: Serveur local de développement - racine (health + documentation)
tags:
  - name: Health
    description: État de l'API et de la base de données
  - name: Diagnostics
    description: Statut de la base de données (désactivé en production)
  - name: Auth
    description: Authentification, sessions et jeton JWT
  - name: Utilisateurs
    description: Gestion des utilisateurs et mot de passe personnel
  - name: Territoires
    description: Districts et communes de Madagascar (Phase 5)
  - name: Imports
    description: Import de fichiers SIG (GeoJSON, JSON, CSV) - ANALYSTE_SIG / SUPER_ADMIN
  - name: Matching
    description: Appariement des enregistrements importés vers les territoires - ANALYSTE_SIG / SUPER_ADMIN
  - name: Événements
    description: Événements cycloniques, trajectoires, zones d'influence, exposition (Phase 7)
  - name: Météo
    description: Observations, prévisions et rafraîchissement météo (Open-Meteo)
  - name: Risques
    description: Moteur de calcul des risques par commune (Phase 8)
  - name: Configurations
    description: Paramétrage des poids et seuils du moteur de risque
  - name: Alertes
    description: Alertes publiques et communications de crise (Phase 9)
  - name: Tableau de bord
    description: Synthèse et indicateurs pour le tableau de bord cartographique
  - name: Rapports & Exports
    description: Rapports, exports CSV / PDF / GeoJSON et téléchargement de rapports
  - name: Assistant IA
    description: Assistant de renseignement IA (Gemini) - (Phase 11)
paths:
  /health:
    get:
      tags: [Health]
      summary: État de santé de l'API (vérifie la base de données)
      description: Accessible aussi à la racine du serveur (`GET /health`).
      operationId: healthCheck
      responses:
        '200':
          description: API opérationnelle (database connected/degraded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [ok, degraded] }
                      environment: { type: string }
                      database: { type: string, enum: [connected, unavailable] }
                      timestamp: { type: string, format: date-time }
              example:
                success: true
                message: API MadaRisk Map opérationnelle.
                data:
                  status: ok
                  environment: development
                  database: connected
                  timestamp: '2026-09-07T08:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'

  /system/database-status:
    get:
      tags: [Diagnostics]
      summary: Statut de la base de données (PostGIS, tables, extensions)
      description: Désactivé en production (retourne 403).
      operationId: systemDatabaseStatus
      responses:
        '200':
          description: Statut de la base de données
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/docs:
    get:
      tags: [Health]
      summary: Documentation interactive Swagger (GET /api/docs)
      description: Interface Swagger UI. Alias `GET /api-docs`. Point d'entrée de la documentation.
      operationId: swaggerUiDocs
      responses:
        '200':
          description: Page HTML de la documentation Swagger UI
          content:
            text/html:
              schema: { type: string }
  /api-docs:
    get:
      tags: [Health]
      summary: Documentation interactive Swagger (alias /api-docs)
      operationId: swaggerUiDocsAlias
      responses:
        '200':
          description: Page HTML de la documentation Swagger UI
          content:
            text/html:
              schema: { type: string }

  /auth/register:
    post:
      tags: [Auth]
      summary: Créer le premier compte SUPER_ADMIN
      description: Fonctionne uniquement si la table `users` est vide (sécurité d'amorçage). Limité à 10 requêtes / 15 min.
      operationId: registerFirstAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: { type: string, minLength: 1, maxLength: 100, example: Admin }
                lastName: { type: string, minLength: 1, maxLength: 100, example: MadaRisk }
                email: { type: string, format: email, example: admin@madarisk.mg }
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Au moins 8 caractères, avec majuscule, minuscule, chiffre et caractère spécial.
                  example: Admin@123!
      responses:
        '201':
          description: Compte SUPER_ADMIN créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/User' }
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion
      description: Retourne un accessToken (15 min) et un refreshToken (7 jours). Limité à 10 tentatives / 15 min (429).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@madarisk.mg }
                password: { type: string, format: password, example: Admin@123! }
            examples:
              loginExample:
                summary: Connexion administrateur
                value:
                  email: admin@madarisk.mg
                  password: Admin@123!
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      accessToken: { type: string, description: Jeton JWT (15 min) }
                      refreshToken: { type: string, description: Jeton de rafraîchissement (7 jours) }
                      user: { $ref: '#/components/schemas/User' }
              example:
                success: true
                message: Connexion réussie
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIs...
                  refreshToken: eyJhbGciOiJIUzI1NiIs...
                  user:
                    id: 00000000-0000-0000-0000-000000000001
                    email: admin@madarisk.mg
                    role: SUPER_ADMIN
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rafraîchir la session
      description: Échange un refreshToken valide contre de nouveaux jetons. Limité à 30 requêtes / 15 min.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Token rafraîchi avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
                      refreshToken: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      description: Révoque la session. Le refreshToken doit être fourni dans le corps (le jeton est invalidé côté serveur).
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: Déconnexion réussie }
                  data: { type: 'null' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil de l'utilisateur connecté
      security:
        - bearerAuth: []
      operationId: getMe
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    get:
      tags: [Utilisateurs]
      summary: Liste des utilisateurs (SUPER_ADMIN)
      security:
        - bearerAuth: []
      operationId: listUsers
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: search, in: query, required: false, schema: { type: string }, description: Recherche sur email, prénom ou nom }
        - { name: role, in: query, required: false, schema: { $ref: '#/components/schemas/UserRole' } }
        - { name: isActive, in: query, required: false, schema: { type: boolean }, description: Filtre actif/inactif ("true"/"false") }
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Utilisateurs]
      summary: Créer un utilisateur (SUPER_ADMIN)
      security:
        - bearerAuth: []
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateBody'
      responses:
        '201':
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/password:
    patch:
      tags: [Utilisateurs]
      summary: Modifier son propre mot de passe
      security:
        - bearerAuth: []
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, minLength: 1 }
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: Au moins 8 caractères, avec majuscule, minuscule, chiffre et caractère spécial.
      responses:
        '200':
          description: Mot de passe modifié avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  message: { type: string, example: Mot de passe modifié avec succès }
                  data: { type: 'null' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}:
    get:
      tags: [Utilisateurs]
      summary: Détail d'un utilisateur
      description: Son propre profil pour tout utilisateur connecté ; n'importe quel profil pour un SUPER_ADMIN.
      security:
        - bearerAuth: []
      operationId: getUser
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Utilisateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Utilisateurs]
      summary: Modifier un utilisateur
      description: |
        Tout utilisateur connecté peut mettre à jour ses propres informations (prénom, nom, email).
        Les changements de rôle et le modification d'un profil tiers nécessitent SUPER_ADMIN (contrôlé dans le service).
      security:
        - bearerAuth: []
      operationId: updateUser
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateBody' }
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}/status:
    patch:
      tags: [Utilisateurs]
      summary: Activer / désactiver un compte (SUPER_ADMIN)
      security:
        - bearerAuth: []
      operationId: updateUserStatus
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean, description: false pour désactiver le compte }
      responses:
        '200':
          description: Statut de l'utilisateur mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /territories/districts:
    get:
      tags: [Territoires]
      summary: Liste des districts
      security:
        - bearerAuth: []
      operationId: listDistricts
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: search, in: query, required: false, schema: { type: string }, description: Recherche sur nom ou code }
        - { name: adminCode, in: query, required: false, schema: { type: string }, description: Code administratif exact }
        - { name: includeGeometry, in: query, required: false, schema: { type: boolean }, description: Inclure la géométrie ("true"/"1") }
      responses:
        '200':
          description: Liste des districts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/District' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /territories/districts/{id}:
    get:
      tags: [Territoires]
      summary: Détail d'un district
      security:
        - bearerAuth: []
      operationId: getDistrict
      parameters:
        - { $ref: '#/components/parameters/DistrictId' }
      responses:
        '200':
          description: Détail du district
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/District' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /territories/communes:
    get:
      tags: [Territoires]
      summary: Liste des communes
      security:
        - bearerAuth: []
      operationId: listCommunes
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: search, in: query, required: false, schema: { type: string }, description: Recherche sur nom ou code }
        - { name: districtId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: districtCode, in: query, required: false, schema: { type: string } }
        - { name: adminCode, in: query, required: false, schema: { type: string } }
        - { name: riskLevel, in: query, required: false, schema: { $ref: '#/components/schemas/RiskLevel' } }
        - { name: eventId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: includeGeometry, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: Liste des communes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Commune' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /territories/communes/{id}:
    get:
      tags: [Territoires]
      summary: Détail d'une commune
      security:
        - bearerAuth: []
      operationId: getCommune
      parameters:
        - { $ref: '#/components/parameters/CommuneId' }
      responses:
        '200':
          description: Détail de la commune
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Commune' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /territories/search:
    get:
      tags: [Territoires]
      summary: Recherche de territoires (district ou commune)
      security:
        - bearerAuth: []
      operationId: searchTerritories
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: Terme de recherche (nom ou code)
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Résultats de recherche
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/District'
                        - $ref: '#/components/schemas/Commune'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /territories/map/districts:
    get:
      tags: [Territoires]
      summary: Districts en GeoJSON FeatureCollection (couche carte)
      security:
        - bearerAuth: []
      operationId: districtsGeoJson
      parameters:
        - { name: eventId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: riskLevel, in: query, required: false, schema: { $ref: '#/components/schemas/RiskLevel' } }
        - { name: includeStats, in: query, required: false, schema: { type: boolean }, description: Inclure les statistiques agrégées }
      responses:
        '200':
          description: District FeatureCollection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoJsonFeatureCollection' }
              examples:
                districtsExample:
                  $ref: '#/components/examples/geoJsonDistricts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /territories/map/communes:
    get:
      tags: [Territoires]
      summary: Communes en GeoJSON FeatureCollection (couche carte)
      security:
        - bearerAuth: []
      operationId: communesGeoJson
      parameters:
        - { name: districtId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: districtCode, in: query, required: false, schema: { type: string } }
        - { name: eventId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: riskLevel, in: query, required: false, schema: { $ref: '#/components/schemas/RiskLevel' } }
        - { name: phase, in: query, required: false, schema: { $ref: '#/components/schemas/RiskPhase' } }
        - { name: includeRisk, in: query, required: false, schema: { type: boolean }, description: Inclure les attributs de risque (défaut true) }
        - { name: includeGeometry, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: Communes FeatureCollection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoJsonFeatureCollection' }
              examples:
                communesExample:
                  $ref: '#/components/examples/geoJsonCommunes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /imports:
    post:
      tags: [Imports]
      summary: Importer un fichier SIG (GeoJSON, JSON, CSV)
      description: |
