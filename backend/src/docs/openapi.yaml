        exposedCommunes:
          type: array
          items: { $ref: '#/components/schemas/ExposedCommune' }
        riskDistribution:
          type: array
          items:
            type: object
            properties:
              riskLevel: { $ref: '#/components/schemas/RiskLevel' }
              count: { type: integer }
        generatedAt: { type: string, format: date-time }
