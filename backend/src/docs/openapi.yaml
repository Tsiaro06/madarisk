        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        population: { type: integer }
        distanceKm: { type: number }
        calculatedAt: { type: string, format: date-time }
    WeatherObservation:
      type: object
      description: Observation météo
      properties:
        id: { type: string, format: uuid }
        communeId: { type: string, format: uuid }
        districtId: { type: string, format: uuid }
        observedAt: { type: string, format: date-time }
        temperatureC: { type: number }
        precipitationMm: { type: number }
        humidityPct: { type: number }
        windSpeedKmh: { type: number }
        windDirectionDeg: { type: integer }
        pressureHpa: { type: number }
        source: { type: string }
        createdAt: { type: string, format: date-time }
    WeatherForecast:
      type: object
      description: Prévisions quotidiennes sur 7 jours
      properties:
        communeId: { type: string, format: uuid }
        communeName: { type: string }
        generatedAt: { type: string, format: date-time }
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              tempMaxC: { type: number }
              tempMinC: { type: number }
              precipitationSumMm: { type: number }
              windSpeedMaxKmh: { type: number }
              windGustMaxKmh: { type: number }
    CommuneRisk:
      type: object
      description: Évaluation de risque d'une commune
      properties:
        communeId: { type: string, format: uuid }
        communeName: { type: string }
        districtId: { type: string, format: uuid }
        districtName: { type: string }
        region: { type: string }
        population: { type: integer }
        riskScore: { type: number }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        components:
          type: object
          properties:
            rain: { type: number }
            wind: { type: number }
            proximity: { type: number }
            vulnerability: { type: number }
            exposure: { type: number }
        mainReasons:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    RiskConfiguration:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rainWeight: { type: number }
        windWeight: { type: number }
        proximityWeight: { type: number }
        vulnerabilityWeight: { type: number }
        exposureWeight: { type: number }
        lowThreshold: { type: number }
        moderateThreshold: { type: number }
        highThreshold: { type: number }
        extremeThreshold: { type: number }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RiskConfigurationCreateBody:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        rainWeight: { type: number, minimum: 0, maximum: 1, default: 0.3 }
        windWeight: { type: number, minimum: 0, maximum: 1, default: 0.25 }
        proximityWeight: { type: number, minimum: 0, maximum: 1, default: 0.2 }
        vulnerabilityWeight: { type: number, minimum: 0, maximum: 1, default: 0.15 }
        exposureWeight: { type: number, minimum: 0, maximum: 1, default: 0.1 }
        lowThreshold: { type: number, minimum: 0, maximum: 100, default: 20 }
        moderateThreshold: { type: number, minimum: 0, maximum: 100, default: 40 }
        highThreshold: { type: number, minimum: 0, maximum: 100, default: 60 }
        extremeThreshold: { type: number, minimum: 0, maximum: 100, default: 80 }
        isActive: { type: boolean, default: true }
    RiskConfigurationUpdateBody:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        rainWeight: { type: number, minimum: 0, maximum: 1 }
        windWeight: { type: number, minimum: 0, maximum: 1 }
        proximityWeight: { type: number, minimum: 0, maximum: 1 }
        vulnerabilityWeight: { type: number, minimum: 0, maximum: 1 }
        exposureWeight: { type: number, minimum: 0, maximum: 1 }
        lowThreshold: { type: number, minimum: 0, maximum: 100 }
        moderateThreshold: { type: number, minimum: 0, maximum: 100 }
        highThreshold: { type: number, minimum: 0, maximum: 100 }
        extremeThreshold: { type: number, minimum: 0, maximum: 100 }
        isActive: { type: boolean }
    Alert:
