                  data: { $ref: '#/components/schemas/DashboardReport' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/events/{eventId}:
    get:
      tags: [Rapports & Exports]
      summary: Rapport détaillé d'un événement
      security:
        - bearerAuth: []
      operationId: eventReport
      parameters:
        - { $ref: '#/components/parameters/EventId' }
      responses:
        '200':
          description: Rapport détaillé de l'événement
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/EventReport' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/export/csv:
    post:
      tags: [Rapports & Exports]
      summary: Exporter des données en CSV
      description: Export brut (communes, districts, événements, alertes, risques, communes exposées). Fichier renvoyé directement.
      security:
        - bearerAuth: []
      operationId: exportCsv
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CsvExportBody' }
            examples:
              exportCsvExample:
                summary: Export des communes
                value: { resourceType: communes }
      responses:
        '200':
          description: Fichier CSV
          content:
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/export/geojson:
    post:
      tags: [Rapports & Exports]
      summary: Exporter des données en GeoJSON
      description: FeatureCollection GeoJSON de communes, districts, zones d'événement ou risques.
      security:
        - bearerAuth: []
      operationId: exportGeoJson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeoJsonExportBody' }
      responses:
        '200':
          description: FeatureCollection GeoJSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeoJsonFeatureCollection' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/export/pdf:
    post:
      tags: [Rapports & Exports]
      summary: Générer un rapport PDF (ADMIN / SUPER_ADMIN)
      security:
        - bearerAuth: []
      operationId: exportPdf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Critères du rapport PDF.
              properties:
                title: { type: string, maxLength: 250 }
                eventId: { type: string, format: uuid }
                districtId: { type: string, format: uuid }
                communeId: { type: string, format: uuid }
                dateFrom: { type: string, format: date-time }
                dateTo: { type: string, format: date-time }
      responses:
        '200':
          description: Rapport PDF généré (Content-Disposition attachment)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports:
    get:
      tags: [Rapports & Exports]
      summary: Liste des rapports générés (ADMIN / SUPER_ADMIN)
      security:
        - bearerAuth: []
      operationId: listReports
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: format, in: query, required: false, schema: { $ref: '#/components/schemas/ReportFormat' } }
        - { name: reportType, in: query, required: false, schema: { type: string } }
        - { name: eventId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Liste des rapports
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportRecord' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/{id}/download:
    get:
      tags: [Rapports & Exports]
      summary: Télécharger un rapport généré (ADMIN / SUPER_ADMIN)
      security:
        - bearerAuth: []
      operationId: downloadReport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: Identifiant du rapport }
      responses:
        '200':
          description: Fichier du rapport
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /ai/chat:
    post:
      tags: [Assistant IA]
      summary: Poser une question à l'assistant IA
      description: |
        Analyse la base de renseignement (événements, alertes actives, risques, météo) et répond.
        - Limité à 30 requêtes / 15 min par utilisateur (headers `RateLimit-*`).
        - Les réponses passent par la politique de sûreté de Gemini.
        - Retourne `503` si l'IA n'est pas configurée (`AI_PROVIDER` absent) ou indisponible.
      security:
        - bearerAuth: []
      operationId: aiChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  description: Question (français, malgache ou anglais).
                conversationId:
                  type: string
                  format: uuid
                  description: Poursuivre une conversation existante (sinon nouvelle conversation).
            examples:
              aiQuestionExample:
                $ref: '#/components/examples/aiQuestion'
      responses:
        '200':
          description: Réponse de l'assistant
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      conversationId: { type: string, format: uuid }
                      reply: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Assistant IA non configuré ou indisponible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500':
          $ref: '#/components/responses/InternalError'

  /ai/conversations:
    get:
      tags: [Assistant IA]
      summary: Liste des conversations IA
      description: Conversations de l'utilisateur connecté (vue globale possible pour SUPER_ADMIN si activée).
      security:
        - bearerAuth: []
      operationId: listAiConversations
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Liste des conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AiConversation' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /ai/conversations/{id}:
    get:
      tags: [Assistant IA]
      summary: Détail d'une conversation IA (messages)
      description: Accessible au propriétaire uniquement (404 sinon).
      security:
        - bearerAuth: []
      operationId: getAiConversation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Conversation de l'assistant
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/AiConversationDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Assistant IA]
      summary: Supprimer une conversation IA
      description: Accessible au propriétaire uniquement (404 sinon).
      security:
        - bearerAuth: []
      operationId: deleteAiConversation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Conversation supprimée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès obtenu via `POST /auth/login`.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: Numéro de page.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Nombre d'éléments par page (max 100).
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DistrictId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommuneId:
      name: communeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MatchId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlertId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RiskConfigurationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Non authentifié (jeton manquant, invalide ou expiré)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: Rôle insuffisant (opérations réservées aux SUPER_ADMIN / ADMIN / ANALYSTE_SIG)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: Conflit (ressource existante, base non vide, opération illégale)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    ValidationError:
      description: Échec de validation (zod) - détails champ par champ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationBody' }
    TooManyRequests:
      description: Trop de requêtes (limite globale 100 / 15 min, login 10 / 15 min, refresh 30 / 15 min, IA 30 / 15 min)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    InternalError:
      description: Erreur interne du serveur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
  examples:
    geoJsonDistricts:
      summary: Districts Madagascar (GeoJSON FeatureCollection simplifié)
      value:
        type: FeatureCollection
        features:
          - type: Feature
            properties:
              id: 05566b10-4df7-4ada-8944-bd2210521a44
              code: '101'
              name: Antsiranana I
              region: Diana
              riskLevel: null
              population: null
            geometry:
              type: MultiPolygon
              coordinates:
                - - - [49.315, -12.290]
                    - [49.310, -12.310]
                    - [49.345, -12.335]
                    - [49.315, -12.290]
    geoJsonCommunes:
      summary: Communes Madagascar (GeoJSON FeatureCollection avec attributs de risque)
      value:
        type: FeatureCollection
        features:
          - type: Feature
            properties:
              id: 62cba7f4-4a91-4a51-9d8b-7f1d8938d5b2
              code: '10101'
              districtCode: '101'
              name: Antsiranana I
              region: Diana
              riskLevel: FAIBLE
              riskScore: 12.4
              population: 275000
            geometry:
              type: Polygon
              coordinates:
                - - [49.315, -12.290]
                  - [49.345, -12.335]
                  - [49.380, -12.300]
                  - [49.315, -12.290]
    cycloneCreation:
      summary: Création d'un cyclone
      value:
        eventCode: CY-2026-0214
        name: Cyclone Freddy - Passage Nord-Est
        type: CYCLONE
        severity: ELEVEE
        status: ACTIF
        description: Cyclone majeur touchant la côte est de Madagascar.
        sourceName: MeteoFrance
        sourceUrl: https://www.meteofrance.mg
        startedAt: '2026-02-14T06:00:00.000Z'
        expectedEndAt: '2026-02-18T18:00:00.000Z'
    trackPoint:
      summary: Ajout d'un point de trajectoire
      value:
        observedAt: '2026-02-14T12:00:00.000Z'
        trackType: OBSERVEE
        latitude: -15.435
        longitude: 49.737
        windSpeedKmh: 120
        gustSpeedKmh: 150
        pressureHpa: 958
    influenceArea:
      summary: Calcul d'une zone d'influence
      value:
        phase: PENDANT
        riskLevel: ELEVE
        radiusKm: 75
    tracksGeoJson:
      summary: Trajectoires GeoJSON d'un événement
      value:
        type: FeatureCollection
        features:
          - type: Feature
            properties:
              trackType: OBSERVEE
              observedAt: '2026-02-14T12:00:00.000Z'
            geometry:
              type: Point
              coordinates: [49.737, -15.435]
    alertCreation:
      summary: Création d'une alerte
      value:
        type: CYCLONE
        severity: EXTREME
        title: Alerte cyclone imminent - District de Sambava
        message: Le cyclone Freddy atteindra la région sous 12 heures. Mesures d'évacuation recommandées.
        eventId: 11111111-1111-1111-1111-111111111111
        districtId: 22222222-2222-2222-2222-222222222222
        expiresAt: '2026-02-18T18:00:00.000Z'
    manualLink:
      summary: Création d'une liaison manuelle
      value:
        sourceRecordId: 33333333-3333-3333-3333-333333333333
        targetType: COMMUNE
        communeId: 62cba7f4-4a91-4a51-9d8b-7f1d8938d5b2
        createAlias: false
    weatherRefresh:
      summary: Rafraîchissement météo
      value:
        communeIds:
          - 62cba7f4-4a91-4a51-9d8b-7f1d8938d5b2
        districtId: 05566b10-4df7-4ada-8944-bd2210521a44
    aiQuestion:
      summary: Question à l'assistant IA
      value:
        message: Donne-moi le résumé de la situation et les alertes actives.
  schemas:
    ErrorBody:
      type: object
      description: Corps d'erreur standard
      properties:
        success:
          type: boolean
          enum: [false]
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    ValidationBody:
      type: object
      description: Erreur de validation (422)
      properties:
        success:
          type: boolean
          enum: [false]
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 1579 }
        totalPages: { type: integer, example: 79 }
    UserRole:
      type: string
      enum: [SUPER_ADMIN, ADMIN, ANALYSTE_SIG, CLIENT]
    HazardType:
      type: string
      enum: [CYCLONE, INONDATION, SECHERESSE, FORTE_PLUIE, VENT_VIOLENT, GLISSEMENT_TERRAIN, FEU_VEGETATION, AUTRE]
    EventStatus:
      type: string
      enum: [BROUILLON, PREVISION, ACTIF, SUIVI, CLOTURE]
    SeverityLevel:
      type: string
      enum: [FAIBLE, MODEREE, ELEVEE, EXTREME]
    RiskLevel:
      type: string
      enum: [FAIBLE, MODERE, ELEVE, EXTREME]
    RiskPhase:
      type: string
      enum: [AVANT, PENDANT, APRES, RETABLISSEMENT]
    TrackType:
      type: string
      enum: [OBSERVEE, PREVUE]
    AlertStatus:
      type: string
      enum: [BROUILLON, PUBLIEE, ARCHIVEE, EXPIREE]
    AlertType:
      type: string
      enum: [CYCLONE, INONDATION, FORTE_PLUIE, VENT_VIOLENT, SECHERESSE, INFORMATION, URGENCE]
    ImportStatus:
      type: string
      enum: [BROUILLON, EN_COURS, TERMINE, ECHEC]
    ImportFileType:
      type: string
      enum: [GEOJSON, JSON, CSV]
    MatchStatus:
      type: string
      enum: [EN_ATTENTE, VALIDE, REJETE, AMBIGU]
    ReportFormat:
      type: string
      enum: [PDF, CSV, XLSX, GEOJSON, PNG]
    User:
      type: object
      description: Utilisateur (les champs sensibles comme `password_hash` ne sont jamais retournés)
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        isActive: { type: boolean }
        organizationId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserCreateBody:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: '#/components/schemas/UserRole' }
        organizationId: { type: string, format: uuid, nullable: true }
    UserUpdateBody:
      type: object
      properties:
        email: { type: string, format: email }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: '#/components/schemas/UserRole', description: Réservé SUPER_ADMIN }
    District:
      type: object
      description: District de Madagascar
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: '101' }
        name: { type: string, example: Antsiranana I }
        region: { type: string, example: Diana }
        population: { type: integer, nullable: true }
        areaKm2: { type: number, nullable: true }
        centroid:
          type: object
          nullable: true
          properties:
            lat: { type: number }
            lon: { type: number }
        geometry:
          allOf:
            - { $ref: '#/components/schemas/GeoJsonGeometry' }
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Commune:
      type: object
      description: Commune de Madagascar
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: '10101' }
        districtId: { type: string, format: uuid }
        name: { type: string, example: Antsiranana I }
        communeType: { type: string, enum: [COMMUNE_URBAINE, COMMUNE_RURALE], nullable: true }
        population: { type: integer, nullable: true }
        households: { type: integer, nullable: true }
        areaKm2: { type: number, nullable: true }
        centroid:
          type: object
          nullable: true
          properties:
            lat: { type: number }
            lon: { type: number }
        geometry:
          allOf:
            - { $ref: '#/components/schemas/GeoJsonGeometry' }
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GeoJsonGeometry:
      type: object
      description: Géométrie GeoJSON (Point, LineString, Polygon, MultiPolygon, cercle)
      properties:
        type:
          type: string
          enum: [Point, LineString, Polygon, MultiPolygon, Circle]
        coordinates: {}
        radius: { type: number, description: Rayon en km pour une géométrie de type Circle }
    GeoJsonFeature:
      type: object
      properties:
        type:
          type: string
          const: Feature
        properties:
          type: object
          additionalProperties: true
        geometry: { $ref: '#/components/schemas/GeoJsonGeometry' }
    GeoJsonFeatureCollection:
      type: object
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items: { $ref: '#/components/schemas/GeoJsonFeature' }
    ImportDetail:
      type: object
      description: Import d'un fichier SIG avec statistiques d'analyse
      properties:
        id: { type: string, format: uuid }
        filename: { type: string, example: districts_de_madagascar.csv }
        fileType: { $ref: '#/components/schemas/ImportFileType' }
        territoryType: { type: string, enum: [DISTRICT, COMMUNE] }
        sourceName: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
        totalRecords: { type: integer }
        validRecords: { type: integer }
        errorRecords: { type: integer }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    ImportError:
      type: object
      properties:
        id: { type: string, format: uuid }
        importId: { type: string, format: uuid }
        rowNumber: { type: integer }
        errorType: { type: string }
        field: { type: string }
        message: { type: string }
        rawValue: { type: string }
    MatchingCandidate:
      type: object
      description: Correspondance proposée entre un enregistrement importé et un territoire
      properties:
        id: { type: string, format: uuid }
        sourceRecordId: { type: string, format: uuid }
        candidateKey: { type: string }
        candidateName: { type: string }
        candidateType: { type: string, enum: [DISTRICT, COMMUNE] }
        confidence: { type: number, minimum: 0, maximum: 100 }
        status: { $ref: '#/components/schemas/MatchStatus' }
        matchedKey: { type: string }
        matchedName: { type: string }
        matchedTerritoryId: { type: string, format: uuid }
        matchedTerritoryType: { type: string, enum: [DISTRICT, COMMUNE] }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
    EventCreateBody:
      type: object
      required: [eventCode, name, type]
      properties:
        eventCode:
          type: string
          pattern: '^[A-Za-z0-9._-]+$'
          maxLength: 100
          example: CY-2026-0214
        name: { type: string, minLength: 1, maxLength: 200, example: Cyclone Freddy - Passage Nord-Est }
        type: { $ref: '#/components/schemas/HazardType' }
        status: { $ref: '#/components/schemas/EventStatus' }
        severity: { $ref: '#/components/schemas/SeverityLevel' }
        description: { type: string, nullable: true }
        sourceName: { type: string, maxLength: 150, nullable: true }
        sourceUrl: { type: string, format: uri, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        expectedEndAt: { type: string, format: date-time, nullable: true }
    EventUpdateBody:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/HazardType' }
        severity: { $ref: '#/components/schemas/SeverityLevel' }
        description: { type: string, nullable: true }
        sourceName: { type: string, maxLength: 150, nullable: true }
        sourceUrl: { type: string, format: uri, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        expectedEndAt: { type: string, format: date-time, nullable: true }
    EventDetail:
      type: object
      description: Événement cyclonique ou autre aléa
      properties:
        id: { type: string, format: uuid }
        eventCode: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/HazardType' }
        status: { $ref: '#/components/schemas/EventStatus' }
        severity: { $ref: '#/components/schemas/SeverityLevel', nullable: true }
        description: { type: string, nullable: true }
        sourceName: { type: string, nullable: true }
        sourceUrl: { type: string, format: uri, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        expectedEndAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TrackCreateBody:
      type: object
      required: [observedAt, latitude, longitude]
      properties:
        observedAt: { type: string, format: date-time }
        forecastFor: { type: string, format: date-time, nullable: true }
        trackType: { $ref: '#/components/schemas/TrackType' }
        latitude: { type: number, format: float, minimum: -90, maximum: 90 }
        longitude: { type: number, format: float, minimum: -180, maximum: 180 }
        windSpeedKmh: { type: number, minimum: 0, nullable: true }
        gustSpeedKmh: { type: number, minimum: 0, nullable: true }
        pressureHpa: { type: number, minimum: 0, nullable: true }
        precipitationMm: { type: number, minimum: 0, nullable: true }
        movementDirection: { type: string, maxLength: 50, nullable: true }
        movementSpeedKmh: { type: number, minimum: 0, nullable: true }
    EventTrack:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        observedAt: { type: string, format: date-time }
        forecastFor: { type: string, format: date-time, nullable: true }
        trackType: { $ref: '#/components/schemas/TrackType' }
        latitude: { type: number }
        longitude: { type: number }
        windSpeedKmh: { type: number, nullable: true }
        gustSpeedKmh: { type: number, nullable: true }
        pressureHpa: { type: number, nullable: true }
        precipitationMm: { type: number, nullable: true }
        movementDirection: { type: string, nullable: true }
        movementSpeedKmh: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }
    TrackInfluenceArea:
      type: object
      description: Zone d'influence calculée autour d'un point de trajectoire
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        trackId: { type: string, format: uuid }
        phase: { $ref: '#/components/schemas/RiskPhase' }
        radiusKm: { type: number }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        circle: { $ref: '#/components/schemas/GeoJsonGeometry' }
        createdAt: { type: string, format: date-time }
    ExposureResult:
      type: object
      description: Résultat du calcul d'exposition d'une commune
      properties:
        communeId: { type: string, format: uuid }
        communeName: { type: string }
        districtId: { type: string, format: uuid }
